name: Back up database

# The free database has no automatic backups. Every Sunday this dumps it, encrypts the dump with
# a passphrase only you know, and keeps it as a workflow artifact for 90 days. Artifacts of a
# public repository are public, which is why the dump is encrypted before it is stored.
#
# To restore: download the artifact, then
#   gpg --decrypt nuenews-backup.sql.gz.gpg | gunzip | psql "$DATABASE_URL"
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump and encrypt
        env:
          # Use the Supabase "Session pooler" connection string: GitHub runners only have IPv4.
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "BACKUP_DATABASE_URL and BACKUP_PASSPHRASE are not set yet, nothing to do."
            exit 0
          fi
          # pg_dump must be at least as new as the server, so use the matching Postgres image.
          docker run --rm postgres:17 pg_dump --no-owner --no-privileges "$BACKUP_DATABASE_URL" \
            | gzip \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase "$BACKUP_PASSPHRASE" --output nuenews-backup.sql.gz.gpg
          ls -l nuenews-backup.sql.gz.gpg

      - name: Keep the encrypted dump
        if: hashFiles('nuenews-backup.sql.gz.gpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nuenews-backup
          path: nuenews-backup.sql.gz.gpg
          retention-days: 90
