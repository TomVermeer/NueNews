# Render Blueprint: one free web service that runs the API, the scheduler and the web app.
# In Render: New, Blueprint, pick this repository. The values marked "sync: false" are asked for
# once in the dashboard (they are secrets or project addresses and never live in git).
# See docs/DEPLOYMENT-PLAN.md for where each value comes from.
services:
  - type: web
    name: nuenews
    runtime: node
    plan: free
    # Pick the region closest to the Supabase project (and to you).
    region: frankfurt
    # Off since the home server took over: a merge to main no longer deploys here. Render stays as a
    # fallback; use "Manual Deploy" in the dashboard to update it. (The `refresh.yml` workflow keeps
    # it awake and its feeds fresh.)
    autoDeploy: false
    healthCheckPath: /api/v1/health
    # "corepack pnpm" runs the pnpm version pinned in package.json (the image is read-only, so "corepack enable" fails). The start command skips pnpm because it is not on the PATH at runtime. Dev dependencies are needed to
    # build the web app, and the API runs with tsx, so install them even though NODE_ENV is production.
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm --filter @nuenews/web build
    startCommand: cd apps/api && node_modules/.bin/tsx src/index.ts
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      # Supabase: Project Settings, Database, Connection string, "Session pooler" (port 5432).
      - key: DATABASE_URL
        sync: false
      # Supabase: Project Settings, API, Project URL.
      - key: SUPABASE_URL
        sync: false
      # Only for older Supabase projects that sign tokens with a shared secret; leave empty otherwise.
      - key: SUPABASE_JWT_SECRET
        sync: false
      # The same project URL and the "anon" public key, baked into the web app at build time.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Shared with the GitHub Actions cron job (the same value as the CRON_SECRET repository secret).
      - key: CRON_SECRET
        generateValue: true
      - key: USER_AGENT
        value: NueNews/0.1 (personal dashboard)
