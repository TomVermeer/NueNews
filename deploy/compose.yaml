# NueNews on the home server. The server needs only this file and a .env next to it (made from
# .env.example). It does not need the source code: it runs an image that was built elsewhere.
#
#   docker compose up -d
#
# The image is built on your PC (see docs/DEPLOYMENT-HOMESERVER.md) and loaded on the server as
# nuenews:local. Later it can come from a registry instead: set NUENEWS_IMAGE in .env.
#
# No port is published on purpose: Docker bypasses the firewall for published ports. Caddy reaches
# the container by name over the shared `web` network (reverse_proxy nuenews:3000).
services:
  nuenews:
    image: ${NUENEWS_IMAGE:-nuenews:local}
    container_name: nuenews
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      USER_AGENT: ${USER_AGENT:-NueNews/0.1 (personal dashboard)}
    networks:
      - web

networks:
  web:
    external: true
